[project]
name = "mmw"
version = "1.1.0"
description = "Money Mgr web: a self-hosted viewer/editor for Money Manager .mmbak backups"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "requests>=2.31",
    "gunicorn>=22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "jsonschema>=4.18",
    "openapi-spec-validator>=0.7",
]

[tool.uv]
# An application, not a library: nothing to build or install, only dependencies.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
