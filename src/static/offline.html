<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202024">
<title>Offline - Money Mgr web</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #17171a; color: #e7e7ea; margin: 0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card { background: #202024; border: 1px solid #34343a; border-radius: 6px; padding: 24px; max-width: 360px; margin: 16px; text-align: center; }
  h1 { font-size: 18px; margin: 12px 0 8px; }
  p { color: #8f8f98; font-size: 14px; margin: 0 0 16px; }
  button { padding: 8px 18px; border: none; border-radius: 4px; background: #5b8dff; color: #0d1424; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true">
    <rect width="512" height="512" rx="112" fill="#26262b"/>
    <path d="M136 368V160l120 136 120-136v208" fill="none" stroke="#5b8dff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Can't reach Money Mgr web</h1>
  <p>You're offline or the server is down. Your data isn't stored on this device, so it needs a connection.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
