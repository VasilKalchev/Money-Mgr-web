openapi: 3.1.0
info:
  title: Money Mgr web API
  version: "1"
  summary: Read and edit the Money Manager database of the token's owner.
  description: |
    A JSON API for scripts and other apps. Every call works on the database
    of the user who owns the token, the same one the web pages show.

    ## Tokens

    Create a token under **Settings > API tokens** and send it on every
    request:

    ```
    curl -H "Authorization: Bearer mmw_..." https://mmw.example/api/v1/accounts
    ```

    - A token is shown once, when it's made; only a hash is kept. Revoke it
      in Settings. Removing the user revokes their tokens; changing the
      password doesn't.
    - Read-only tokens can only make `GET` calls; writes get 403.
    - Token calls don't need the CSRF token. Tokens only work on `/api/v1/`,
      not on the pages or the pages' own unversioned `/api/` routes.
    - A logged-in browser session works on `/api/v1/` too, with the
      session's `X-CSRF-Token` header on writes.
    - Behind a reverse proxy that does its own login (Authelia, Authentik,
      ...), let `/api/v1/` through without it, or the proxy blocks token
      calls.

    ## Conventions

    Every response is JSON with `"ok": true`, or `"ok": false` and an
    `error` message. Dates are `YYYY-MM-DD` and times `HH:MM:SS`, in the
    server's local time zone (`time_zone` in `/status`), like the app's own.
    Amounts are numbers.

    ## Writes and sync

    API writes are like edits in the pages: the first write after a restart
    or a new database file takes a backup (unless that's switched off in
    Settings), and they show up as changes made here at the next sync.
servers:
  - url: /api/v1
security:
  - bearerToken: []

tags:
  - name: Status
  - name: Reference data
    description: Accounts, categories and currencies.
  - name: Transactions

paths:
  /status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Who the token belongs to and which database it reaches
      description: Works before a database is set up; `database` is then null.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /accounts:
    get:
      tags: [Reference data]
      operationId: listAccounts
      summary: All accounts with their balances
      description: In the app's group and account order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, accounts]
                properties:
                  ok: {const: true}
                  accounts:
                    type: array
                    items: {$ref: "#/components/schemas/Account"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/NoDatabase"}

  /categories:
    get:
      tags: [Reference data]
      operationId: listCategories
      summary: The income and expense category trees
      description: |
        Deleted categories are left out unless `show_deleted=show`, which
        lists them too, a deleted child under its root. Transactions keep a
        deleted category's uid, so this finds its name and root.
      parameters:
        - name: show_deleted
          in: query
          schema: {type: string, enum: [hide, show], default: hide}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, income, expense]
                properties:
                  ok: {const: true}
                  income:
                    type: array
                    items: {$ref: "#/components/schemas/Category"}
                  expense:
                    type: array
                    items: {$ref: "#/components/schemas/Category"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/NoDatabase"}

  /currencies:
    get:
      tags: [Reference data]
      operationId: listCurrencies
      summary: All currencies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, currencies]
                properties:
                  ok: {const: true}
                  currencies:
                    type: array
                    items: {$ref: "#/components/schemas/Currency"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/NoDatabase"}

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Transactions matching the Transactions page's filters
      description: |
        All filters are optional. Repeat a list parameter to match any of
        its values (`?account=1&account=4`). Unparseable `amount_min`,
        `amount_max`, `has_note` and `has_desc` values are ignored, as on
        the page.
      parameters:
        - name: account
          in: query
          description: Account uid.
          schema: {type: array, items: {type: string}}
        - name: category
          in: query
          description: Category uid. A root category includes its children.
          schema: {type: array, items: {type: string}}
        - name: category_only
          in: query
          description: Root category uid, without its children.
          schema: {type: array, items: {type: string}}
        - name: type
          in: query
          description: Type code (not name).
          schema: {type: array, items: {$ref: "#/components/schemas/TypeCode"}}
        - name: transfer_id
          in: query
          description: |
            A transfer's `transfer_id`, shared by its two rows. Combine with
            `show_mirror`: by default only the sending row is listed, with
            `show` both, with `only` the mirror.
          schema: {type: array, items: {type: string}}
        - name: from
          in: query
          description: First date, inclusive.
          schema: {type: string, format: date}
        - name: to
          in: query
          description: Last date, inclusive.
          schema: {type: string, format: date}
        - name: q_note
          in: query
          description: Text in the note. A leading `!` means "doesn't contain".
          schema: {type: string}
        - name: q_desc
          in: query
          description: Text in the description. A leading `!` means "doesn't contain".
          schema: {type: string}
        - name: has_note
          in: query
          schema: {type: string, enum: ["yes", "no"]}
        - name: has_desc
          in: query
          schema: {type: string, enum: ["yes", "no"]}
        - name: amount_min
          in: query
          description: Smallest amount, in the account's currency.
          schema: {type: number}
        - name: amount_max
          in: query
          description: Largest amount, in the account's currency.
          schema: {type: number}
        - name: entered_currency
          in: query
          description: Uid of the currency the amount was entered in.
          schema: {type: string}
        - name: show_deleted
          in: query
          schema: {type: string, enum: [hide, show, only], default: hide}
        - name: show_mirror
          in: query
          description: |
            Each transfer is stored as two rows; the mirror is the receiving
            side, so it's hidden by default to count each transfer once.
          schema: {type: string, enum: [hide, show, only], default: hide}
        - name: updated_since
          in: query
          description: |
            Only rows changed at or after this Unix time in milliseconds
            (`updated_ms`): when MMW saw the change, whether it was made here
            or came in from the app at a sync. Reading from the time of the
            last read sees every change, synced ones included.
          schema: {type: integer, minimum: 0}
        - name: sort
          in: query
          description: '`updated` sorts by `updated_ms`.'
          schema: {type: string, enum: [date, amount, entered_amount, account, updated], default: date}
        - name: dir
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, total, limit, offset, transactions]
                properties:
                  ok: {const: true}
                  total:
                    type: integer
                    description: Matching transactions across all pages.
                  limit: {type: integer}
                  offset: {type: integer}
                  transactions:
                    type: array
                    items: {$ref: "#/components/schemas/Transaction"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/NoDatabase"}

    post:
      tags: [Transactions]
      operationId: addTransaction
      summary: Add one transaction or several
      description: |
        A transfer adds two linked rows (the transfer and its mirror), and
        the response has the mirror as `mirror`. The mirror's amount is
        `to_amount`, or else the amount converted into the destination
        account's currency with the currencies' rates.

        `entered_amount` and `entered_currency` record what was typed in
        when it differs from the amount in the account's currency (a foreign
        purchase, or a pre-euro amount restated). Without them the amount is
        also the entered amount.

        To add several at once, all or none (the lines of one split
        payment), send `{"transactions": [...]}`: up to 1000, each what a
        single POST takes, added in list order. If any fails, nothing is
        written and the 400 lists every failing item with its reason and
        the status a single POST would have answered. Success returns
        `results`, one per item in order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: "#/components/schemas/NewTransaction"}
                - {$ref: "#/components/schemas/NewTransactionBatch"}
            examples:
              expense:
                value: {type: expense, account: "4", amount: 12.5, category: c3,
                        date: "2026-10-02", time: "13:30", note: lunch}
              transfer:
                value: {type: transfer, account: "4", to_account: "1", amount: 200}
              foreign:
                value: {type: expense, account: "4", amount: 5.11, category: c3,
                        entered_amount: 10, entered_currency: BGN}
              several:
                value:
                  transactions:
                    - {type: expense, account: "4", amount: 30, category: c3,
                       date: "2026-10-02", time: "18:05", note: groceries}
                    - {type: expense, account: "4", amount: 12.4, category: c7,
                       date: "2026-10-02", time: "18:05", note: groceries}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/TransactionEditResponse"}
                  - {$ref: "#/components/schemas/TransactionBatchResponse"}
        "400":
          description: |
            Invalid input. For several transactions, nothing was written and
            `errors` lists the failing items.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ReadOnly"}
        "409": {$ref: "#/components/responses/NoDatabase"}

    patch:
      tags: [Transactions]
      operationId: editTransactions
      summary: Change several transactions at once
      description: |
        Up to 1000 changes, each a `uid` plus what a PATCH of
        `/transactions/{uid}` takes, `expect` included. They're applied in
        list order, each like that PATCH (mirror handling too), so a
        transfer's sending row and then its mirror can be in one request,
        and an `expect` sees the changes before it.

        All or nothing: if any change fails, nothing is written and the 400
        lists every failing change with its reason and the status a single
        PATCH would have answered (412 for an `expect` not met).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionBatch"}
            example:
              changes:
                - {uid: "a1f3", amount: 6.14, entered_amount: 12, entered_currency: BGN,
                   expect: {amount: 12, entered_amount: 12}}
                - {uid: "b7c2", note: rent}
      responses:
        "200":
          description: Every change made
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionBatchResponse"}
        "400":
          description: |
            Invalid input, or some changes failed and nothing was written.
            `errors` lists the failing changes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ReadOnly"}
        "409": {$ref: "#/components/responses/NoDatabase"}

  /transactions/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: One transaction, deleted ones included
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NoDatabase"}
    patch:
      tags: [Transactions]
      operationId: editTransaction
      summary: Change one or more fields of a transaction
      description: |
        Changing the amount or the account restates the main-currency
        amount, and the entered amount by the same ratio unless
        `entered_amount` is given. A transfer's accounts can't be changed
        (delete it and add a new one), and only income and expense have a
        category.

        `type` changes between `income` and `expense` (with a `category`
        from the new tree) and between `balance_increase` and
        `balance_decrease`; the uid stays.

        On either row of a transfer, the date, time, note and description
        are written to the other row too, and the response has it as
        `mirror`. The other row's amount follows when both accounts share a
        currency; across currencies set it with `to_amount` on the sending
        row (or a PATCH of the mirror).

        `expect` makes the change conditional: it holds field values, as
        GET returns them, that the transaction must have now, or nothing is
        written and the answer is 412.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransactionChanges"}
            example: {amount: 14, note: lunch with Sam, expect: {amount: 12.5}}
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TransactionEditResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ReadOnly"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NoDatabase"}
        "412": {$ref: "#/components/responses/ExpectNotMet"}
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Soft-delete a transaction
      description: |
        Marks it deleted, as the app does; sync carries the deletion to the
        app. Deleting either row of a transfer deletes the other row and
        its fee too. Deleting an already deleted transaction succeeds.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, deleted]
                properties:
                  ok: {const: true}
                  deleted:
                    type: array
                    description: Uids of every row marked deleted.
                    items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ReadOnly"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NoDatabase"}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: An API token from Settings, `mmw_<id>_<secret>`.

  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: {const: false}
        error: {type: string}

    Status:
      type: object
      required: [ok, user, auth, can_write, database, time_zone]
      properties:
        ok: {const: true}
        user: {type: string}
        auth:
          type: string
          enum: [token, session, proxy]
        can_write: {type: boolean}
        time_zone:
          type: object
          description: The time zone dates and times are in.
          required: [name, utc_offset_minutes]
          properties:
            name:
              type: string
              description: An IANA name such as `Europe/Sofia` where the server has one, else an abbreviation.
            utc_offset_minutes:
              type: integer
              description: The offset from UTC now.
        database:
          oneOf:
            - type: "null"
            - type: object
              required: [name, mtime]
              properties:
                name:
                  type: [string, "null"]
                  description: The .mmbak file's name.
                mtime:
                  type: [number, "null"]
                  description: Last change, Unix time in seconds.

    Account:
      type: object
      required: [uid, name, group_uid, group, currency, balance, transaction_count, status]
      properties:
        uid: {type: string}
        name: {type: [string, "null"]}
        group_uid: {type: [string, "null"]}
        group:
          type: [string, "null"]
          description: The heading the app files the account under.
        currency:
          type: [string, "null"]
          description: ISO code.
        balance:
          type: number
          description: Derived from the account's live transactions.
        transaction_count:
          type: integer
          description: Live rows on the account, transfer mirrors included.
        status:
          type: string
          enum: [normal, hidden, deleted, other]

    Category:
      type: object
      required: [uid, name, deleted, children]
      properties:
        uid: {type: string}
        name: {type: [string, "null"]}
        deleted: {type: boolean}
        children:
          type: array
          items:
            type: object
            required: [uid, name, deleted]
            properties:
              uid: {type: string}
              name: {type: [string, "null"]}
              deleted: {type: boolean}

    Currency:
      type: object
      required: [uid, iso, rate, decimals]
      properties:
        uid: {type: string}
        iso: {type: [string, "null"]}
        rate:
          type: [number, "null"]
          description: Rate to the main currency.
        decimals: {type: [integer, "null"]}

    TypeName:
      type: string
      enum: [income, expense, transfer, transfer_mirror, balance_increase, balance_decrease]
    TypeCode:
      type: string
      description: |
        `0` income, `1` expense, `3` transfer, `4` transfer mirror, `7`
        balance increase, `8` balance decrease.
      enum: ["0", "1", "3", "4", "7", "8"]

    Transaction:
      type: object
      required: [uid, type, date, time, timestamp_ms, amount, currency, entered_amount, entered_currency,
                 account_uid, account, to_account_uid, to_account, category_uid, category, note, description,
                 transfer_id, deleted, updated_ms, app_updated_ms]
      properties:
        uid: {type: string}
        type:
          description: A type name; an unknown code is passed through as is.
          anyOf:
            - $ref: "#/components/schemas/TypeName"
            - type: string
        date: {type: [string, "null"], format: date}
        time:
          type: [string, "null"]
          description: HH:MM:SS, local time.
        timestamp_ms:
          type: [integer, "null"]
          description: Date and time as Unix time in milliseconds.
        amount:
          type: [number, "null"]
          description: Always positive, in the account's currency; `type` gives the direction.
        currency:
          type: [string, "null"]
          description: The account's currency (ISO code).
        entered_amount:
          type: [number, "null"]
          description: The amount as typed in, which can differ when the app converted it.
        entered_currency: {type: [string, "null"]}
        account_uid: {type: [string, "null"]}
        account: {type: [string, "null"]}
        to_account_uid:
          type: [string, "null"]
          description: Set on transfers. On a mirror row it's the sending account.
        to_account: {type: [string, "null"]}
        category_uid:
          type: [string, "null"]
          description: '`"-4"` on balance adjustments.'
        category:
          type: [string, "null"]
          description: '"Root" or "Root > Child".'
        note: {type: string}
        description: {type: string}
        transfer_id:
          type: [string, "null"]
          description: Shared by both rows of a transfer.
        deleted: {type: boolean}
        updated_ms:
          type: [integer, "null"]
          description: |
            When MMW saw the row change, Unix time in milliseconds: set by
            every write here and by every sync or upload that changes the
            row, whichever side made the change. A row unchanged since MMW
            got it has the app's own time (`app_updated_ms`).
        app_updated_ms:
          type: [integer, "null"]
          description: |
            The app's own last-change time (`UTIME`), which a sync carries
            over from the phone, so it can be from before the sync.

    TransactionResponse:
      type: object
      required: [ok, transaction]
      properties:
        ok: {const: true}
        transaction: {$ref: "#/components/schemas/Transaction"}

    TransactionEditResponse:
      type: object
      required: [ok, transaction]
      properties:
        ok: {const: true}
        transaction: {$ref: "#/components/schemas/Transaction"}
        mirror:
          $ref: "#/components/schemas/Transaction"
          description: For a transfer, its other row, after the change.

    NewTransactionBatch:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/NewTransaction"}

    NewTransaction:
      type: object
      required: [type, account, amount]
      properties:
        type:
          description: A name or a code (as a string), except the transfer mirror.
          anyOf:
            - type: string
              enum: [income, expense, transfer, balance_increase, balance_decrease]
            - type: string
              enum: ["0", "1", "3", "7", "8"]
        account:
          type: string
          description: Account uid. For a transfer, the sending account.
        to_account:
          type: string
          description: Receiving account uid. Required for, and only used by, transfers.
        amount:
          description: More than 0, in the account's currency. A numeric string works too.
          type: [number, string]
        category:
          type: string
          description: |
            Required for income and expense, from that tree. Ignored for
            transfers and balance adjustments.
        date:
          type: string
          format: date
          description: Omitted means now (and `time` is ignored).
        time:
          type: string
          pattern: '^\d{1,2}:\d{2}(:\d{2})?$'
          description: Omitted means midnight.
        note:
          type: string
          description: Balance adjustments without one get "Difference".
        description: {type: string}
        entered_amount:
          description: |
            More than 0: the amount as typed in, in `entered_currency`. Give
            both or neither.
          type: [number, string]
        entered_currency:
          type: string
          description: ISO code (as `entered_currency` in a transaction) or currency uid.
        to_amount:
          description: |
            Transfers only: more than 0, the amount that arrived, in the
            destination account's currency.
          type: [number, string]

    TransactionChanges:
      minProperties: 1
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/TransactionFields"}

    TransactionFields:
      type: object
      description: What a PATCH can change, plus `expect`.
      properties:
        date:
          type: string
          format: date
          description: Keeps the current time unless `time` is given too.
        time:
          type: string
          pattern: '^\d{1,2}:\d{2}(:\d{2})?$'
          description: Keeps the current date unless `date` is given too.
        amount:
          description: 0 or more, in the account's currency. A numeric string works too.
          type: [number, string]
        note: {type: string}
        description: {type: string}
        category:
          type: string
          description: Income and expense only, from that tree.
        account:
          type: string
          description: Not for transfers.
        type:
          description: |
            A name or a code. `income` <-> `expense` (needs `category`) or
            `balance_increase` <-> `balance_decrease`.
          type: string
        entered_amount:
          description: 0 or more, written as given instead of rescaled with `amount`.
          type: [number, string]
        entered_currency:
          type: string
          description: ISO code or currency uid.
        to_amount:
          description: |
            On the sending row of a transfer: 0 or more, the mirror's amount,
            in the destination account's currency.
          type: [number, string]
        expect:
          type: object
          description: |
            Field values, named and written as a `Transaction` shows them
            (`type` by name, `category_uid` for the category), that the
            transaction must have before the change. Numbers match within
            rounding error.
          example: {type: expense, amount: 12.3, entered_amount: 24.06}

    TransactionBatch:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            required: [uid]
            minProperties: 2
            unevaluatedProperties: false
            allOf:
              - {$ref: "#/components/schemas/TransactionFields"}
            properties:
              uid: {type: string}

    TransactionBatchResponse:
      type: object
      required: [ok, results]
      properties:
        ok: {const: true}
        results:
          type: array
          description: |
            One per change or transaction, in order, with the rows as the
            whole batch left them.
          items:
            type: object
            required: [transaction]
            properties:
              transaction: {$ref: "#/components/schemas/Transaction"}
              mirror:
                $ref: "#/components/schemas/Transaction"
                description: For a transfer, its other row.

    BatchError:
      type: object
      required: [ok, error]
      properties:
        ok: {const: false}
        error: {type: string}
        errors:
          type: array
          description: Every item that failed. Missing when the request itself was invalid.
          items:
            type: object
            required: [index, uid, status, error]
            properties:
              index:
                type: integer
                description: The item's place in `changes` or `transactions`, from 0.
              uid:
                type: [string, "null"]
                description: The change's `uid`; null for a new transaction.
              status:
                type: integer
                description: What a single PATCH or POST would have answered (400, 404 or 412).
              error: {type: string}

  responses:
    BadRequest:
      description: Invalid input; `error` says what.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ReadOnly:
      description: A read-only token was used for a write.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ExpectNotMet:
      description: The transaction doesn't have the values in `expect`; nothing was written.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such transaction.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoDatabase:
      description: No database is set up yet, or it's an unsupported version.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
